# lint、整形、型チェック、単体テスト、ハーネスの自己点検。DB につながるテストと E2E は、
# テスト用 DB の整備（ハーネス移行計画の P3 / P4）のあとで足す
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # バージョンは package.json の packageManager に従う
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: format
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: harness
        run: pnpm harness:check
